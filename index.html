<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 추출기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg: #eef1f3;
    --paper: #ffffff;
    --ink: #1c2b33;
    --sub: #5b6b72;
    --line: #dbe1e4;
    --accent: #0f6e63;
    --accent-soft: #e3f1ee;
    --warn: #b3541e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5;
  }
  .shell{
    max-width:1120px;
    margin:0 auto;
    padding:40px 24px 80px;
  }
  header{
    margin-bottom:28px;
  }
  header h1{
    font-size:26px;
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:14.5px;
  }
  .layout{
    display:grid;
    grid-template-columns: 340px 1fr;
    gap:20px;
  }
  @media (max-width: 860px){
    .layout{grid-template-columns: 1fr;}
  }
  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
    color:var(--ink);
  }
  .field .hint{
    font-size:12px;
    color:var(--sub);
    margin-top:4px;
  }
  textarea{
    width:100%;
    min-height:220px;
    resize:vertical;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-size:13.5px;
    font-family:inherit;
    color:var(--ink);
  }
  textarea:focus, input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  input[type=text]{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
  }
  .filebtn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px dashed var(--line);
    border-radius:8px;
    padding:9px 12px;
    font-size:13px;
    color:var(--sub);
    cursor:pointer;
    background:#fafbfb;
  }
  .filebtn:hover{border-color:var(--accent); color:var(--accent);}
  input[type=file]{display:none;}
  .checks{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .checks label{
    display:flex;
    align-items:flex-start;
    gap:8px;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
  }
  .checks input{margin-top:3px;}
  .checks .desc{font-weight:400; color:var(--sub); font-size:12.5px; display:block; margin-top:2px;}
  button.primary{
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:12px 14px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    margin-top:4px;
  }
  button.primary:hover{background:#0b564d;}
  button.primary:disabled{background:#a9b6b4; cursor:not-allowed;}
  button.ghost{
    background:none;
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:8px;
    padding:9px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  button.ghost:hover{border-color:var(--accent); color:var(--accent);}
  .results-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .tabs{
    display:flex;
    gap:6px;
    background:#f1f4f4;
    padding:4px;
    border-radius:9px;
  }
  .tabs button{
    border:none;
    background:none;
    padding:8px 14px;
    font-size:13.5px;
    font-weight:600;
    color:var(--sub);
    border-radius:7px;
    cursor:pointer;
  }
  .tabs button.active{
    background:#fff;
    color:var(--accent);
    box-shadow:0 1px 2px rgba(0,0,0,.08);
  }
  .count{
    font-size:12.5px;
    color:var(--sub);
  }
  .empty{
    color:var(--sub);
    font-size:13.5px;
    padding:40px 10px;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:8px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  thead th{
    text-align:left;
    font-size:12px;
    color:var(--sub);
    font-weight:600;
    padding:8px 10px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{
    padding:9px 10px;
    border-bottom:1px solid #edf0f1;
    vertical-align:top;
  }
  tbody tr:hover{background:#f7fafa;}
  mark{
    background:var(--accent-soft);
    color:var(--accent);
    padding:0 2px;
    border-radius:3px;
    font-weight:600;
  }
  .table-wrap{
    max-height:520px;
    overflow:auto;
    border:1px solid var(--line);
    border-radius:8px;
  }
  .table-wrap table thead{position:sticky; top:0; background:#fff; z-index:1;}
  .status{
    font-size:12.5px;
    color:var(--warn);
    margin-top:8px;
    min-height:16px;
  }
  .col-narrow{width:64px;}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>단어 추출기</h1>
    <p>텍스트에서 특정 단어를 찾아, 그 뒤 단어 또는 해당 줄 전체를 순서대로 모아 엑셀로 내려받습니다.</p>
  </header>

  <div class="layout">
    <div class="panel">
      <div class="field">
        <label for="text-input">원본 텍스트</label>
        <textarea id="text-input" placeholder="여기에 텍스트를 붙여넣거나, 아래에서 .hwpx 파일을 불러오세요."></textarea>
        <label class="filebtn" style="margin-top:8px;">
          📄 <span id="file-btn-label">.hwpx / .txt 파일 불러오기</span>
          <input type="file" id="file-input" accept=".hwpx,.txt">
        </label>
        <div class="hint" id="file-status"></div>
      </div>

      <div class="field">
        <label for="keyword-input">찾을 특정 단어</label>
        <input type="text" id="keyword-input" placeholder="예: 담당자">
        <div class="hint">텍스트에 등장하는 모든 위치를 순서대로 찾아냅니다.</div>
      </div>

      <div class="field">
        <label>추출 방식</label>
        <div class="checks">
          <label>
            <input type="checkbox" id="mode-word" checked>
            <span>뒤에 오는 단어만 추출
              <span class="desc">특정 단어 바로 다음 칸(어절)의 단어 전체를 가져옵니다.</span>
            </span>
          </label>
          <label>
            <input type="checkbox" id="mode-line" checked>
            <span>해당 줄 전체 추출
              <span class="desc">특정 단어가 포함된 줄을 통째로 가져옵니다.</span>
            </span>
          </label>
          <label>
            <input type="checkbox" id="mode-table">
            <span>표에서 옆 칸 값 추출
              <span class="desc">표 안에서 특정 단어가 있는 칸을 찾아, 바로 오른쪽 칸의 값을 가져옵니다. (.hwpx 업로드 시에만 가능)</span>
            </span>
          </label>
        </div>
      </div>

      <button class="primary" id="run-btn">추출하기</button>
      <div class="status" id="status"></div>
    </div>

    <div class="panel">
      <div class="results-head">
        <div class="tabs" id="tabs">
          <button data-tab="word" class="active">뒤 단어 결과</button>
          <button data-tab="line">줄 전체 결과</button>
          <button data-tab="table">표 옆칸 결과</button>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <span class="count" id="result-count"></span>
          <button class="ghost" id="download-btn" disabled>엑셀로 다운로드</button>
        </div>
      </div>

      <div id="word-view">
        <div class="empty" id="word-empty">왼쪽에 텍스트와 단어를 입력한 뒤 추출하기를 눌러주세요.</div>
        <div class="table-wrap" id="word-table-wrap" style="display:none;">
          <table>
            <thead>
              <tr><th class="col-narrow">번호</th><th class="col-narrow">줄 번호</th><th>찾은 단어</th><th>바로 다음 단어</th></tr>
            </thead>
            <tbody id="word-tbody"></tbody>
          </table>
        </div>
      </div>

      <div id="line-view" style="display:none;">
        <div class="empty" id="line-empty">왼쪽에 텍스트와 단어를 입력한 뒤 추출하기를 눌러주세요.</div>
        <div class="table-wrap" id="line-table-wrap" style="display:none;">
          <table>
            <thead>
              <tr><th class="col-narrow">번호</th><th class="col-narrow">줄 번호</th><th class="col-narrow">일치 횟수</th><th>해당 줄 전체</th></tr>
            </thead>
            <tbody id="line-tbody"></tbody>
          </table>
        </div>
      </div>

      <div id="table-view" style="display:none;">
        <div class="empty" id="table-empty">왼쪽에 텍스트와 단어를 입력한 뒤 추출하기를 눌러주세요.</div>
        <div class="table-wrap" id="table-table-wrap" style="display:none;">
          <table>
            <thead>
              <tr><th class="col-narrow">번호</th><th class="col-narrow">표 번호</th><th class="col-narrow">행 번호</th><th>찾은 칸</th><th>옆 칸 값</th></tr>
            </thead>
            <tbody id="table-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const textInput = document.getElementById('text-input');
  const fileInput = document.getElementById('file-input');
  const keywordInput = document.getElementById('keyword-input');
  const modeWord = document.getElementById('mode-word');
  const modeLine = document.getElementById('mode-line');
  const modeTable = document.getElementById('mode-table');
  const runBtn = document.getElementById('run-btn');
  const downloadBtn = document.getElementById('download-btn');
  const statusEl = document.getElementById('status');
  const resultCount = document.getElementById('result-count');

  const tabs = document.getElementById('tabs');
  const wordView = document.getElementById('word-view');
  const lineView = document.getElementById('line-view');
  const tableView = document.getElementById('table-view');
  const wordEmpty = document.getElementById('word-empty');
  const lineEmpty = document.getElementById('line-empty');
  const tableEmpty = document.getElementById('table-empty');
  const wordTableWrap = document.getElementById('word-table-wrap');
  const lineTableWrap = document.getElementById('line-table-wrap');
  const tableTableWrap = document.getElementById('table-table-wrap');
  const wordTbody = document.getElementById('word-tbody');
  const lineTbody = document.getElementById('line-tbody');
  const tableTbody = document.getElementById('table-tbody');

  let wordResults = [];
  let lineResults = [];
  let tableResults = [];
  let hwpxTables = null; // .hwpx 업로드 시에만 채워지는 표 구조 [{rows:[[cell,...],...]}, ...]
  let activeTab = 'word';

  const fileStatus = document.getElementById('file-status');

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    statusEl.textContent = '';
    const isHwpx = /\.hwpx$/i.test(file.name);

    if (isHwpx) {
      fileStatus.textContent = 'HWPX 파일에서 본문과 표를 추출하는 중...';
      try {
        const result = await extractHwpxText(file);
        textInput.value = result.text;
        hwpxTables = result.tables;
        const tableCount = result.tables.length;
        fileStatus.textContent = `"${file.name}" 에서 본문을 불러왔습니다. (문단 단위 줄, 표 ${tableCount}개 인식됨)`;
      } catch (err) {
        fileStatus.textContent = '';
        hwpxTables = null;
        statusEl.textContent = 'HWPX 파일을 읽는 중 오류가 발생했습니다: ' + err.message;
      }
      return;
    }

    hwpxTables = null;
    const reader = new FileReader();
    reader.onload = (ev) => {
      textInput.value = ev.target.result;
      fileStatus.textContent = `"${file.name}" 을(를) 불러왔습니다. (일반 텍스트에는 표 구조가 없어 "표에서 옆 칸 값 추출"은 사용할 수 없습니다)`;
    };
    reader.onerror = () => { statusEl.textContent = '파일을 읽는 중 오류가 발생했습니다.'; };
    reader.readAsText(file, 'UTF-8');
  });

  // 사용자가 텍스트를 직접 수정하면 원본 표 구조와 더 이상 일치하지 않으므로 표 데이터를 무효화한다.
  textInput.addEventListener('input', () => {
    if (hwpxTables) {
      hwpxTables = null;
      fileStatus.textContent = '텍스트가 수정되어 표 구조 정보가 초기화되었습니다.';
    }
  });

  // 특정 태그명을 가진 "가장 가까운" 조상 요소를 찾는다 (표 중첩 구조에서 소속을 정확히 판별하기 위함)
  function closestByTag(node, tagName){
    let cur = node.parentNode;
    while (cur && cur.tagName !== tagName) cur = cur.parentNode;
    return cur;
  }

  // 표(hp:tbl) 하나를 행/열 구조의 2차원 배열(문자열)로 변환한다.
  // 중첩된 표(셀 안에 또 다른 표)가 있을 경우, 바깥 표의 행/셀 목록에는 포함시키지 않는다.
  function parseTable(tblNode){
    const rows = [];
    const trNodes = tblNode.getElementsByTagName('hp:tr');
    for (let ri = 0; ri < trNodes.length; ri++) {
      const tr = trNodes[ri];
      if (closestByTag(tr, 'hp:tbl') !== tblNode) continue; // 중첩 표의 행은 제외

      const tcNodes = tr.getElementsByTagName('hp:tc');
      const cells = [];
      for (let ci = 0; ci < tcNodes.length; ci++) {
        const tc = tcNodes[ci];
        if (closestByTag(tc, 'hp:tr') !== tr) continue; // 중첩 표의 셀은 제외

        const tNodes = tc.getElementsByTagName('hp:t');
        let cellText = '';
        for (let k = 0; k < tNodes.length; k++) {
          if (closestByTag(tNodes[k], 'hp:tc') !== tc) continue; // 중첩 표 안의 텍스트는 제외
          cellText += tNodes[k].textContent;
        }
        cells.push(cellText.trim());
      }
      if (cells.length > 0) rows.push(cells);
    }
    return rows;
  }

  async function extractHwpxText(file){
    const zip = await JSZip.loadAsync(file);
    const sectionFiles = Object.keys(zip.files)
      .filter(name => /^Contents\/section\d+\.xml$/i.test(name))
      .sort((a, b) => {
        const na = parseInt(a.match(/section(\d+)/i)[1], 10);
        const nb = parseInt(b.match(/section(\d+)/i)[1], 10);
        return na - nb;
      });

    if (sectionFiles.length === 0) {
      throw new Error('본문(section) 파일을 찾을 수 없습니다. 올바른 HWPX 파일인지 확인해주세요.');
    }

    const lines = [];
    const tables = [];

    for (const name of sectionFiles) {
      const xmlStr = await zip.files[name].async('string');
      const doc = new DOMParser().parseFromString(xmlStr, 'application/xml');
      if (doc.querySelector('parsererror')) {
        throw new Error('본문 XML을 해석할 수 없습니다.');
      }

      // hp:t(텍스트 조각)를 문서 순서대로 순회하면서, 각 조각이 속한 "가장 가까운" hp:p(문단)에 묶는다.
      // 표 셀 안의 문단은 바깥 문단 안에 중첩되어 있으므로, 가장 가까운 문단을 찾아야
      // 셀 안 텍스트가 바깥 문단과 섞이지 않고 별도의 줄로 분리된다.
      const tNodes = doc.getElementsByTagName('hp:t');
      const paraMap = new Map();
      for (let i = 0; i < tNodes.length; i++) {
        const t = tNodes[i];
        const node = closestByTag(t, 'hp:p');
        if (!node) continue;
        if (!paraMap.has(node)) paraMap.set(node, []);
        paraMap.get(node).push(t.textContent);
      }
      for (const parts of paraMap.values()) {
        lines.push(parts.join(''));
      }

      // 표 구조 파싱 (행/셀 단위)
      const tblNodes = doc.getElementsByTagName('hp:tbl');
      for (let ti = 0; ti < tblNodes.length; ti++) {
        // 중첩 표(셀 안의 표)는 최상위 표 목록에 별도로 추가하지 않고, 자신을 감싸는 표의 파싱에서 제외되었으므로
        // 여기서는 독립된 표로서 그대로 추가한다 (중첩 표 자체도 검색 대상이 되도록).
        const rows = parseTable(tblNodes[ti]);
        if (rows.length > 0) tables.push(rows);
      }
    }

    return { text: lines.join('\n'), tables };
  }

  tabs.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-tab]');
    if (!btn) return;
    activeTab = btn.dataset.tab;
    [...tabs.children].forEach(b => b.classList.toggle('active', b === btn));
    wordView.style.display = activeTab === 'word' ? '' : 'none';
    lineView.style.display = activeTab === 'line' ? '' : 'none';
    tableView.style.display = activeTab === 'table' ? '' : 'none';
    updateCount();
  });

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function highlight(text, keyword){
    if (!keyword) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const escKw = escapeHtml(keyword).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escaped.replace(new RegExp(escKw, 'g'), m => `<mark>${m}</mark>`);
  }

  function updateCount(){
    let n = 0;
    if (activeTab === 'word') n = wordResults.length;
    else if (activeTab === 'line') n = lineResults.length;
    else n = tableResults.length;
    resultCount.textContent = n ? `${n}건 발견` : '';
  }

  runBtn.addEventListener('click', () => {
    const text = textInput.value;
    const keyword = keywordInput.value.trim();
    statusEl.textContent = '';

    if (!text.trim()) { statusEl.textContent = '원본 텍스트를 입력해주세요.'; return; }
    if (!keyword) { statusEl.textContent = '찾을 특정 단어를 입력해주세요.'; return; }
    if (!modeWord.checked && !modeLine.checked && !modeTable.checked) { statusEl.textContent = '추출 방식을 하나 이상 선택해주세요.'; return; }

    const lines = text.split(/\r\n|\r|\n/);
    wordResults = [];
    lineResults = [];
    tableResults = [];

    lines.forEach((line, lineIdx) => {
      const lineNo = lineIdx + 1;
      const tokens = line.split(/\s+/).filter(t => t.length > 0);

      if (modeWord.checked) {
        for (let i = 0; i < tokens.length; i++) {
          if (tokens[i] === keyword) {
            const next = tokens[i + 1];
            if (next !== undefined) {
              wordResults.push({ lineNo, found: tokens[i], next });
            }
          }
        }
      }

      if (modeLine.checked) {
        const matchCount = tokens.filter(t => t === keyword).length || (line.includes(keyword) ? (line.split(keyword).length - 1) : 0);
        if (line.includes(keyword)) {
          lineResults.push({ lineNo, matchCount, line });
        }
      }
    });

    if (modeTable.checked) {
      if (hwpxTables && hwpxTables.length > 0) {
        hwpxTables.forEach((rows, tIdx) => {
          rows.forEach((cells, rIdx) => {
            for (let c = 0; c < cells.length; c++) {
              if (cells[c].includes(keyword)) {
                const next = cells[c + 1];
                if (next !== undefined) {
                  tableResults.push({ tableNo: tIdx + 1, rowNo: rIdx + 1, found: cells[c], next });
                }
              }
            }
          });
        });
      } else {
        statusEl.textContent = '표 구조 정보가 없습니다. .hwpx 파일을 업로드해야 "표에서 옆 칸 값 추출"을 사용할 수 있습니다.';
      }
    }

    renderWordTable();
    renderLineTable();
    renderTableTable();
    updateCount();
    downloadBtn.disabled = (wordResults.length === 0 && lineResults.length === 0 && tableResults.length === 0);

    if (wordResults.length === 0 && lineResults.length === 0 && tableResults.length === 0 && !statusEl.textContent) {
      statusEl.textContent = `"${keyword}"를 텍스트에서 찾지 못했습니다.`;
    }
  });

  function renderWordTable(){
    if (!modeWord.checked || wordResults.length === 0) {
      wordEmpty.style.display = '';
      wordTableWrap.style.display = 'none';
      wordEmpty.textContent = modeWord.checked ? '일치하는 결과가 없습니다.' : '"뒤에 오는 단어만 추출"이 선택되지 않았습니다.';
      wordTbody.innerHTML = '';
      return;
    }
    wordEmpty.style.display = 'none';
    wordTableWrap.style.display = '';
    const keyword = keywordInput.value.trim();
    wordTbody.innerHTML = wordResults.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${r.lineNo}</td>
        <td>${highlight(r.found, keyword)}</td>
        <td><strong>${escapeHtml(r.next)}</strong></td>
      </tr>
    `).join('');
  }

  function renderLineTable(){
    if (!modeLine.checked || lineResults.length === 0) {
      lineEmpty.style.display = '';
      lineTableWrap.style.display = 'none';
      lineEmpty.textContent = modeLine.checked ? '일치하는 결과가 없습니다.' : '"해당 줄 전체 추출"이 선택되지 않았습니다.';
      lineTbody.innerHTML = '';
      return;
    }
    lineEmpty.style.display = 'none';
    lineTableWrap.style.display = '';
    const keyword = keywordInput.value.trim();
    lineTbody.innerHTML = lineResults.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${r.lineNo}</td>
        <td>${r.matchCount}</td>
        <td>${highlight(r.line, keyword)}</td>
      </tr>
    `).join('');
  }

  function renderTableTable(){
    if (!modeTable.checked || tableResults.length === 0) {
      tableEmpty.style.display = '';
      tableTableWrap.style.display = 'none';
      if (!modeTable.checked) {
        tableEmpty.textContent = '"표에서 옆 칸 값 추출"이 선택되지 않았습니다.';
      } else if (!hwpxTables) {
        tableEmpty.textContent = '표 구조 정보가 없습니다. .hwpx 파일을 업로드해주세요.';
      } else {
        tableEmpty.textContent = '일치하는 결과가 없습니다.';
      }
      tableTbody.innerHTML = '';
      return;
    }
    tableEmpty.style.display = 'none';
    tableTableWrap.style.display = '';
    const keyword = keywordInput.value.trim();
    tableTbody.innerHTML = tableResults.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${r.tableNo}</td>
        <td>${r.rowNo}</td>
        <td>${highlight(r.found, keyword)}</td>
        <td><strong>${escapeHtml(r.next)}</strong></td>
      </tr>
    `).join('');
  }

  downloadBtn.addEventListener('click', () => {
    const wb = XLSX.utils.book_new();
    let added = false;

    if (wordResults.length > 0) {
      const rows = [['번호', '줄 번호', '찾은 단어', '바로 다음 단어']];
      wordResults.forEach((r, i) => rows.push([i + 1, r.lineNo, r.found, r.next]));
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:6},{wch:8},{wch:16},{wch:24}];
      XLSX.utils.book_append_sheet(wb, ws, '뒤 단어 결과');
      added = true;
    }

    if (lineResults.length > 0) {
      const rows = [['번호', '줄 번호', '일치 횟수', '해당 줄 전체']];
      lineResults.forEach((r, i) => rows.push([i + 1, r.lineNo, r.matchCount, r.line]));
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:6},{wch:8},{wch:10},{wch:70}];
      XLSX.utils.book_append_sheet(wb, ws, '줄 전체 결과');
      added = true;
    }

    if (tableResults.length > 0) {
      const rows = [['번호', '표 번호', '행 번호', '찾은 칸', '옆 칸 값']];
      tableResults.forEach((r, i) => rows.push([i + 1, r.tableNo, r.rowNo, r.found, r.next]));
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:6},{wch:8},{wch:8},{wch:20},{wch:24}];
      XLSX.utils.book_append_sheet(wb, ws, '표 옆칸 결과');
      added = true;
    }

    if (!added) return;
    const keyword = keywordInput.value.trim() || 'result';
    XLSX.writeFile(wb, `단어추출_${keyword}.xlsx`);
  });
})();
</script>
</body>
</html>
